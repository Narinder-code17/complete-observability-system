services:

  # --------------------------------------------------
  # Flask Application
  # --------------------------------------------------
  app:
    build:
      context: ./app
    container_name: observability-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - observability

  # --------------------------------------------------
  # Prometheus - Metrics
  # --------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: observability-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - app
    networks:
      - observability

  # --------------------------------------------------
  # Loki - Centralized Logs
  # --------------------------------------------------
  loki:
    image: grafana/loki:3.5.0
    container_name: observability-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    networks:
      - observability

  # --------------------------------------------------
  # Grafana - Visualization
  # --------------------------------------------------
  grafana:
    image: grafana/grafana:12.1.1
    container_name: observability-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks:
      - observability

  # --------------------------------------------------
  # Promtail - Log Collector
  # --------------------------------------------------
  promtail:
    image: grafana/promtail:3.5.0
    container_name: observability-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command:
      - "-config.file=/etc/promtail/config.yml"
    depends_on:
      - loki
    networks:
      - observability

  # --------------------------------------------------
  # Jaeger - Distributed Tracing
  # --------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: observability-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - observability

# --------------------------------------------------
# Persistent Storage
# --------------------------------------------------
volumes:
  prometheus_data:
  loki_data:
  grafana_data:

# --------------------------------------------------
# Shared Network
# --------------------------------------------------
networks:
  observability:
    driver: bridge