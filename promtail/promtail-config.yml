server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  - job_name: docker-containers

    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:

      # Get Docker container name
      - source_labels:
          - __meta_docker_container_name
        regex: "/(.*)"
        target_label: service_name

      # Also keep the container name as a label
      - source_labels:
          - __meta_docker_container_name
        regex: "/(.*)"
        target_label: container

      # Docker log stream
      - source_labels:
          - __meta_docker_container_log_stream
        target_label: stream

      # Keep Docker job label
      - target_label: job
        replacement: docker